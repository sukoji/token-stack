<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" role="img" aria-label="AI Coding Agents">
<title>AI Coding Agents</title>
<style>
.f{opacity:0;animation:fu 0.70s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.bx{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:gx 0.90s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes gx{to{transform:scaleX(1)}}
.by{transform:scaleY(0);transform-box:fill-box;transform-origin:center bottom;animation:gy 0.80s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes gy{to{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}.sky-star{animation:none!important;opacity:.3!important;transform:none!important}.skyline-cloud-bank,.skyline-horizon-haze,.skyline-window-glint,.skyline-water-ripple{animation:none!important;transform:none!important}.skyline-vehicle-flow,.skyline-pedestrian-flow{animation:none!important;transform:none!important}}
</style>
<rect x="0.5" y="0.5" width="494" height="179" rx="8" fill="#0d1117" stroke="#3d444d"/>
<g font-family="'Segoe UI',Ubuntu,Sans-Serif"><text class="f" x="25" y="33" font-size="16" font-weight="600" fill="#58a6ff">◈ AI Coding Agents</text><text class="f" style="animation-delay:0.12s" x="470" y="33" font-size="11" text-anchor="end" fill="#9ea7b3">sessions · all time</text><g class="f" style="animation-delay:0.12s"><text x="25" y="70" font-size="12" fill="#e6edf3">claude-code</text><rect x="165" y="60" width="182" height="9" rx="4.5" fill="#21262d"/><rect class="bx" style="animation-delay:0.12s" x="165" y="60" width="109" height="9" rx="4.5" fill="#58a6ff"/><text x="470" y="70" font-size="11" text-anchor="end" fill="#9ea7b3">59.7% · 80 sessions</text></g>
<g class="f" style="animation-delay:0.24s"><text x="25" y="104" font-size="12" fill="#e6edf3">codex</text><rect x="165" y="94" width="182" height="9" rx="4.5" fill="#21262d"/><rect class="bx" style="animation-delay:0.24s" x="165" y="94" width="53" height="9" rx="4.5" fill="#3fb950"/><text x="470" y="104" font-size="11" text-anchor="end" fill="#9ea7b3">29.1% · 39 sessions</text></g>
<g class="f" style="animation-delay:0.36s"><text x="25" y="138" font-size="12" fill="#e6edf3">antigravity</text><rect x="165" y="128" width="182" height="9" rx="4.5" fill="#21262d"/><rect class="bx" style="animation-delay:0.36s" x="165" y="128" width="20" height="9" rx="4.5" fill="#d29922"/><text x="470" y="138" font-size="11" text-anchor="end" fill="#9ea7b3">11.2% · 15 sessions</text></g></g>
